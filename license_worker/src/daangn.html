<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>당근 광고자동화 — 매물 올리기</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --ink:#111827; --dim:#6b7280;
    --blue:#2563eb; --blue-weak:#eff5ff; --ok:#059669; --warn:#b45309; --bad:#dc2626;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    -webkit-text-size-adjust:100%}
  a{color:var(--blue)}
  button{font:inherit; cursor:pointer}
  .wrap{max-width:1180px; margin:0 auto; padding:0 16px 64px}

  header{background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
  .hbar{max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .brand{font-weight:800; font-size:16px; letter-spacing:-.3px}
  .brand span{color:var(--blue)}
  .who{font-size:12px; color:var(--dim); background:var(--blue-weak); border:1px solid #dbe6fb;
    padding:3px 8px; border-radius:999px; white-space:nowrap}
  .hbar .grow{flex:1}
  .ghost{background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 10px; color:var(--dim)}
  .ghost:hover{border-color:#c9d3e3; color:var(--ink)}
  .tabs{max-width:1180px; margin:0 auto; padding:0 16px; display:flex; gap:4px}
  .tab{border:0; background:transparent; padding:10px 14px; font-weight:700; color:var(--dim);
    border-bottom:2px solid transparent; margin-bottom:-1px}
  .tab.on{color:var(--blue); border-bottom-color:var(--blue)}
  .tab .n{display:inline-block; min-width:18px; margin-left:6px; padding:0 5px; border-radius:999px;
    background:#e5e7eb; color:#374151; font-size:11px; font-weight:800; vertical-align:1px}
  .tab.on .n{background:var(--blue); color:#fff}

  h2{font-size:14px; margin:22px 0 8px; display:flex; align-items:center; gap:8px}
  h2 .c{color:var(--dim); font-weight:600}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow)}
  .pad{padding:14px}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:16px}
  .kpi{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow)}
  .kpi .k{font-size:12px; color:var(--dim)}
  .kpi .v{font-size:26px; font-weight:800; letter-spacing:-1px; margin-top:2px}
  .kpi .v em{font-size:13px; font-weight:600; font-style:normal; color:var(--dim); margin-left:3px}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{padding:9px 10px; border-bottom:1px solid #eef1f6; text-align:left; vertical-align:top}
  th{font-size:12px; color:var(--dim); font-weight:700; background:#fafbfd; white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right; white-space:nowrap}
  .nowrap{white-space:nowrap}
  .scroll{overflow-x:auto}

  .pill{display:inline-block; padding:2px 7px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap}
  .pill.pending{background:#fff7ed; color:var(--warn); border:1px solid #fed7aa}
  .pill.active{background:#ecfdf5; color:var(--ok); border:1px solid #a7f3d0}
  .pill.rejected{background:#fef2f2; color:var(--bad); border:1px solid #fecaca}
  .pill.etc{background:#f3f4f6; color:#4b5563; border:1px solid #e5e7eb}
  .pill.lounge{background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe}
  .pill.joint{background:#f0f9ff; color:#0369a1; border:1px solid #bae6fd}

  .bars{display:grid; gap:6px}
  .bar{display:grid; grid-template-columns:88px 1fr 42px; align-items:center; gap:8px; font-size:12px}
  .bar .t{height:10px; border-radius:999px; background:#e8edf7; overflow:hidden}
  .bar .f{height:100%; background:linear-gradient(90deg,#60a5fa,#2563eb); border-radius:999px}

  .btn{border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 10px; font-size:12px; font-weight:700}
  .btn:hover{border-color:#c9d3e3}
  .btn.ok{background:var(--ok); border-color:var(--ok); color:#fff}
  .btn.no{background:#fff; border-color:#fecaca; color:var(--bad)}
  .btn.b{background:var(--blue); border-color:var(--blue); color:#fff}
  .btn[disabled]{opacity:.5; cursor:default}
  .row-acts{display:flex; gap:6px; flex-wrap:wrap}

  .empty{padding:26px 14px; text-align:center; color:var(--dim); font-size:13px}
  .thumbs{display:flex; gap:4px; margin-top:6px; flex-wrap:wrap}
  .thumbs img{width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--line)}
  .memo{color:var(--dim); font-size:12px; margin-top:4px; white-space:pre-wrap}
  .done td{background:#fbfcfe; color:#9aa3af}
  .done .txt{text-decoration:line-through}

  .gate{max-width:400px; margin:14vh auto; text-align:center}
  .gate input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; margin-top:12px}
  .gate .btn{width:100%; padding:11px; margin-top:8px; font-size:14px}
  .gate p{color:var(--dim); font-size:12px}
  .err{background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:10px; padding:10px 12px; margin-top:14px; font-size:13px}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; color:#fff;
    padding:10px 16px; border-radius:999px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:60}
  @media (max-width:640px){ .hbar{padding:8px 12px} .wrap{padding:0 12px 56px} th,td{padding:8px} }

  /* ── 매물 올리기 (2026-09-28) ── */
  .paste{border:1.5px dashed #93a4c3; background:#f6f8fc; border-radius:12px; padding:12px 14px; margin-top:16px}
  .paste textarea{width:100%; min-height:64px; resize:vertical; font:inherit; font-size:13px; padding:9px 11px;
    border:1px solid var(--line); border-radius:8px; background:#fff; margin:6px 0 8px}
  .paste .msg{font-size:12px; color:var(--dim); margin-top:6px; line-height:1.5}
  .paste .msg b{color:#1e3a5f}
  .form{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px 14px; padding:14px}
  .form label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--dim); font-weight:700}
  .form label.wide, .form div.wide{grid-column:1 / -1}
  .form input,.form select,.form textarea{font:inherit; font-size:14px; font-weight:400; color:var(--ink);
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; min-width:0}
  .form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue)}
  .form .sug{position:relative}
  .form .sug .list{position:absolute; left:0; right:0; top:100%; z-index:15; background:#fff; border:1px solid var(--line);
    border-radius:10px; box-shadow:0 10px 30px rgba(16,24,40,.14); max-height:260px; overflow:auto; margin-top:4px}
  .form .sug .list div{padding:9px 12px; cursor:pointer; border-bottom:1px solid #eef1f6; font-size:13px; font-weight:400; color:var(--ink)}
  .form .sug .list div:hover{background:var(--blue-weak)}
  .form .sug .list small{display:block; color:var(--dim); font-size:11px}
  .form .filled{border-color:#86efac; background:#f0fdf4}
  .form .miss{border-color:#f87171 !important; background:#fef2f2 !important}
  #dgpanel{position:fixed;right:16px;bottom:16px;z-index:9998;width:min(440px,92vw);background:#fff;border:1px solid #fdba74;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);font-size:13px;overflow:hidden}
  #dgpanel .dgh{background:#fff7ed;padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #fed7aa}
  #dgpanel .dgbar{height:6px;background:#fde68a}
  #dgpanel .dgbar i{display:block;height:100%;background:#ff6f0f;transition:width .3s}
  #dgpanel .dgbody{max-height:40vh;overflow:auto;padding:8px 12px}
  #dgpanel .dgi{padding:5px 0;border-bottom:1px solid #f1f5f9;display:flex;gap:6px;align-items:flex-start}
  #dgpanel .dgi:last-child{border-bottom:0}
  #dgpanel .dgf{padding:8px 12px;border-top:1px solid #fed7aa;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#fffbf5}
  .create2col{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:14px; align-items:start}
  #c_bldg{position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; padding:12px 14px; font-size:13px}
  @media (max-width:1040px){ .create2col{grid-template-columns:1fr} #c_bldg{position:static; max-height:none} }
  #c_bldg h4{margin:0 0 6px; font-size:14px}
  #c_bldg .bsec{background:#f6f8fc; border-radius:10px; padding:10px 12px; margin-bottom:10px}
  #c_bldg .brow{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid #e8ecf3}
  #c_bldg .brow:last-child{border-bottom:0}
  #c_bldg .brow span:first-child{color:var(--dim)}
  #c_bldg .brow b{font-weight:700; text-align:right}
  #c_bldg table{width:100%; border-collapse:collapse; font-size:12px; background:#fff; border-radius:8px; overflow:hidden}
  #c_bldg th,#c_bldg td{padding:5px 6px; border-bottom:1px solid #eef1f6; text-align:left}
  #c_bldg th{color:var(--dim); font-weight:600; background:#fafbfe}
  #c_bldg td.r,#c_bldg th.r{text-align:right; white-space:nowrap}
  #c_bldg tr.hit td{background:#fff7ed; font-weight:700}
  #c_bldg .bnote{color:var(--dim); font-size:12px}
  #c_phr_list{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; margin-top:8px}
  .phr{border:1px solid var(--line); border-radius:10px; background:#fff; padding:8px; display:flex; flex-direction:column; gap:6px}
  .phr textarea{width:100%; box-sizing:border-box; min-height:74px; resize:vertical; margin:0; font:inherit; font-size:13px; border:1px solid #e8ecf3; border-radius:8px; padding:6px 8px}
  .phr .pacts{display:flex; gap:6px; justify-content:space-between}
  #c_missing{background:#fffbea;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:13px}
  #c_missing.ok{background:#f0fdf4;border-color:#bbf7d0}
  #c_missing .mbtn{display:inline-block;margin:3px 4px 0 0;padding:3px 9px;border:1px solid #f59e0b;border-radius:999px;background:#fff;color:#92400e;font-weight:700;font-size:12px;cursor:pointer}
  #c_missing .mbtn.opt{border-color:#cbd5e1;color:#475569;font-weight:500}
  .form .actions{grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding-top:4px}
  .form .actions .btn{padding:10px 18px; font-size:14px}
  .hint{font-size:12px; color:var(--dim); margin-top:6px; line-height:1.5}
  /* ── 여러 매물 한 번에 (2026-09-30) ── */
  .bulkbox{margin-top:10px; border-color:#b7c4dc; background:#f9fafc}
  .bulkbox textarea{min-height:56px}
  table.bulk td{font-size:12.5px}
  table.bulk{width:100%; table-layout:auto}
  table.bulk .pill{white-space:normal; line-height:1.3}
  table.bulk td,table.bulk th{padding:8px 6px}
  table.bulk .btn{padding:3px 8px; font-size:11px}
  table.bulk tr.done td{background:#f7fdf9; color:#4b5563}
</style>
<style>#csubmit,#cdaangn,#bregister,label:has(#blgall),label:has(input[data-lg]){display:none!important}.tab[data-t=photo] .n,.tab[data-t=db] .n,.tab[data-t=log] .n{display:none}</style>

<body>

<!-- ══════════════════════════════════════════════════════════════
     당근 광고자동화 — 라운지 인트라넷 화면을 복제한 당근 전용 화면 (build_daangn_html.py 가 만든다. 직접 고치지 말 것)
     API_BASE 만 맞춰두면 되고, 토큰은 파일에 박지 않고 접속한 사람이 넣어 브라우저에만 저장한다.
     화면에 없는 것(계약 원장·백업·결제·회원목록·매출)은 이 토큰으로도 부를 수 없다.
     ══════════════════════════════════════════════════════════════ -->
<script>
  const CONFIG = {
    API_BASE: '/daangn/api',
    REFRESH_MS: 300000,          // 현황 자동 새로고침 주기
    // 네이버 매물 링크 정리 서버 (브라우저에서 네이버를 직접 부를 수 없어 워커가 대신 읽는다). 비우면 글 붙여넣기만 동작
    PARSE_API: 'https://daangn-parse.808hyukkim.workers.dev/parse',
  }
</script>

<div id="app"></div>

<script>
/* ── 토큰 ─────────────────────────────────────────────── */
const TK = 'daangn_ad_token'
const token = () => localStorage.getItem(TK) || ''
const setToken = v => { v ? localStorage.setItem(TK, v) : localStorage.removeItem(TK) }

/* ── 유틸 ─────────────────────────────────────────────── */
const el = document.getElementById('app')
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
const won = n => (n == null || n === '' ? '' : Number(n).toLocaleString('ko-KR'))
const 만 = n => (n == null || n === '' ? '' : Number(n) >= 10000 ? (Number(n)/10000).toLocaleString('ko-KR') + '억' : Number(n).toLocaleString('ko-KR') + '만')
const dt = s => { if (!s) return ''
  const d = new Date(s), p = v => String(v).padStart(2,'0')
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}` }
const ago = s => { if (!s) return ''
  const m = Math.floor((Date.now() - new Date(s)) / 60000)
  if (m < 1) return '방금'; if (m < 60) return m + '분 전'
  if (m < 1440) return Math.floor(m/60) + '시간 전'
  return Math.floor(m/1440) + '일 전' }
const ROLE_KO = { principal:'대표', broker:'소속중개사', assistant:'중개보조원' }
const phone10 = p => !p ? '' : String(p).replace(/^\+?82/, '0').replace(/(\d{2,3})(\d{3,4})(\d{4})$/, '$1-$2-$3')
/* 자동검증은 승인 근거가 아니라 보조자료 — 어드민 화면과 같은 문장으로 보여준다 */
/* VWorld 판정 사유 코드 → 사람 말 */
const WHY = {
  'name-not-in-office': '선택한 사무소 종사자 명단에 이름이 없음',
  'office-not-found': '등록번호로 사무소를 찾지 못함',
  'name-not-principal': '대표(개설등록자)가 아님',
  'name-not-in-seoul-list': '서울시 명단에 이름이 없음',
  'missing-params': '이름·등록번호 누락',
  'vworld-no-key': 'VWorld 키 없음',
  'vworld-fetch-failed': 'VWorld 조회 실패',
  'seoul-fetch-failed': '서울시 명단 조회 실패',
  'error': '조회 중 오류',
}
function autoLines(ac) {
  if (!ac || typeof ac !== 'object') return []
  const out = []
  const v = ac.vworld
  if (v && v.checked) out.push(v.nameInOffice
    ? { ok:true, t:`VWorld 명단 일치 · 직위 ${ROLE_KO[v.listedRole] ?? v.listedRole ?? '?'}` }
    : { ok:false, t:`VWorld 명단 불일치 — ${WHY[v.reason] ?? v.reason ?? '이름 없음'}` })
  else out.push({ ok:null, t:'VWorld 명단 조회 실패' })
  const g = ac.legacy
  if (g && g.matched) out.push({ ok: g.officeMatch ?? null,
    t:`기존회원 ${String(g.matched).toUpperCase()} 매칭${g.officeMatch ? ' · 사무소 일치' : ' · 구 사무소 ' + (g.officeName ?? '?')}` })
  else out.push({ ok:null, t:'기존회원 매칭 없음' })
  return out
}
const STAT = { pending:'승인대기', active:'공급중', rejected:'반려', done:'처리완료', new:'접수', incomplete:'서류미비' }
const KIND = { joint:'중개사 공동중개', lounge:'라운지 직공급', etc:'기타' }
const pill = s => `<span class="pill ${['pending','active','rejected'].includes(s) ? s : 'etc'}">${esc(STAT[s] ?? s ?? '')}</span>`

let toastT
function toast(msg) {
  document.querySelectorAll('.toast').forEach(n => n.remove())
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2600)
}

/* ── API ──────────────────────────────────────────────── */
async function api(path, body) {
  const res = await fetch(CONFIG.API_BASE + '/' + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json', 'x-intranet-token': token() },
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store',
  })
  let j = {}
  try { j = await res.json() } catch (_) {}
  if (!res.ok) {
    if (res.status === 401) { setToken(''); renderGate('로그인이 만료되었습니다. 다시 로그인해 주세요.'); throw new Error('401') }
    const err = new Error(j.error || ('요청 실패 (' + res.status + ')')); err.code = j.code || ''; err.data = j; throw err
  }
  return j
}

/* ── 상태 ─────────────────────────────────────────────── */
const S = { me:null, tab:null, data:{}, busy:{} }
let timer

/* ── 토큰 입력 화면 ───────────────────────────────────── */
function renderGate(err) {
  clearInterval(timer); dgcStop(false)
  el.innerHTML = `
    <div class="wrap"><div class="gate">
      <div class="brand" style="font-size:20px">당근 <span>광고자동화</span></div>
      <p style="margin-top:6px">매물수집기 계정(아이디·비밀번호)으로 로그인하세요. 수집기와 같은 아이디·비밀번호입니다. 탭은 관리자가 켜 준 기능만 보입니다.</p>
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      <input id="lg_id" placeholder="아이디" autocomplete="username" spellcheck="false" style="margin-bottom:8px">
      <input id="lg_pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button class="btn b" id="go">로그인</button>
      <p style="margin-top:14px">로그인 상태는 이 브라우저에만 저장됩니다. 공용 PC 에서는 사용 후 우측 상단 [로그아웃] 을 눌러주세요.</p>
    </div></div>`
  const id = document.getElementById('lg_id'), pw = document.getElementById('lg_pw'), btn = document.getElementById('go')
  const go = async () => {
    const u = id.value.trim(), p = pw.value; if (!u) return id.focus(); if (!p) return pw.focus()
    btn.disabled = true; btn.textContent = '확인 중…'
    try {
      const res = await fetch(CONFIG.API_BASE + '/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: u, password: p }), cache: 'no-store' })
      let j = {}; try { j = await res.json() } catch (_) {}
      if (!res.ok || !j.token) throw new Error(j.error || ('로그인 실패 (' + res.status + ')'))
      setToken(j.token); boot()
    } catch (e) { renderGate(e.message); const i2 = document.getElementById('lg_id'); if (i2) i2.value = u }
  }
  btn.onclick = go
  pw.onkeydown = e => { if (e.key === 'Enter') go() }; id.onkeydown = e => { if (e.key === 'Enter') pw.focus() }
  id.focus()
}

/* ── 진입 ─────────────────────────────────────────────── */
async function boot() {
  if (!token()) return renderGate()
  el.innerHTML = `<div class="wrap"><div class="empty" style="margin-top:20vh">불러오는 중…</div></div>`
  try { S.me = await api('summary') } catch (e) { if (e.message !== '401') renderGate(e.message); return }
  const fts = S.me.features || []; const order = [].concat(fts.includes('daangn') ? ['create', 'uploads'] : [], fts.includes('photo') ? ['photo'] : [], fts.includes('db') ? ['db'] : [], ['log'])
  if (!fts.includes('daangn') && !fts.includes('photo')) setTimeout(() => toast('이 계정에는 아직 당근 광고·사진950 권한이 없습니다. 관리자에게 요청하세요.'), 400)
  if (!order.length) return renderGate('이 토큰에는 열람 권한이 없습니다.')
  if (!order.includes(S.tab)) S.tab = order[0]
  renderShell(order)
  await load(S.tab)
  clearInterval(timer)
  timer = setInterval(() => { if (!document.hidden) refresh() }, CONFIG.REFRESH_MS)
}

async function refresh() {
  try { S.me = await api('summary') } catch (_) { return }
  paintCounts(); await load(S.tab, true)
}

/* ── 껍데기 ───────────────────────────────────────────── */
const TAB_NAME = { create:'당근 올리기', uploads:'업로드 기록', supply:'공급 현황', review:'검수·승인', cs:'CS 접수함', photo:'사진 950', db:'지번 조회', log:'내 활동' }
function renderShell(order) {
  el.innerHTML = `
    <header>
      <div class="hbar">
        <div class="brand">당근 <span>광고자동화</span></div>
        <div class="who">${esc(S.me.label)}</div><span id="hconn" style="font-size:12px;margin-left:8px"></span>
        <div class="grow"></div>
        <span id="stamp" style="font-size:12px;color:var(--dim)"></span>
        <button class="ghost" id="reload">새로고침</button>
        <button class="ghost" id="out">로그아웃</button>
      </div>
      <div class="tabs">
        ${order.map(k => `<button class="tab ${k === S.tab ? 'on' : ''}" data-t="${k}">${TAB_NAME[k]}<span class="n" data-c="${k}">0</span></button>`).join('')}
      </div>
    </header>
    <div class="wrap"><div id="body"></div></div>`
  document.getElementById('reload').onclick = () => refresh()
  document.getElementById('out').onclick = () => { setToken(''); S.data = {}; renderGate() }
  el.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    S.tab = b.dataset.t
    el.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b))
    load(S.tab)
  })
  paintCounts()
}

function paintCounts() {
  const c = {
    create: S.me.create?.pending ?? 0,
    supply: (S.me.supply?.pending ?? 0) + (S.me.supply?.active ?? 0),
    review: (S.me.review?.listings ?? 0) + (S.me.review?.signups ?? 0),
    cs: (S.me.cs?.feedback ?? 0) + (S.me.cs?.clean ?? 0) + (S.me.cs?.move ?? 0),
  }
  el.querySelectorAll('[data-c]').forEach(n => n.textContent = c[n.dataset.c] ?? 0)
  const st = document.getElementById('stamp')
  if (st) st.textContent = dt(new Date().toISOString()) + ' 기준'
}

/* ── 탭 로딩 ──────────────────────────────────────────── */
/* 매물 올리기 탭 DOM 보관: 다른 탭으로 갔다 와도 입력 중인 폼·일괄 목록·사진 950 이 그대로 */
const keepCreate = () => {
  const body = document.getElementById('body'); if (!body || S.painted !== 'create') return
  let k = document.getElementById('keep_create'); if (!k) { k = document.createElement('div'); k.id = 'keep_create'; k.style.display = 'none'; document.body.appendChild(k) }
  k.innerHTML = ''; while (body.firstChild) k.appendChild(body.firstChild)
}
const restoreCreate = () => {
  const body = document.getElementById('body'), k = document.getElementById('keep_create')
  if (!body || !k || !k.childNodes.length) return false
  body.innerHTML = ''; while (k.firstChild) body.appendChild(k.firstChild); return true
}
async function load(tab, quiet) {
  const body = document.getElementById('body')
  if (!body) return
  const seq = (S.loadSeq = (S.loadSeq || 0) + 1)   // 늦게 도착한 옛 응답은 버린다
  if (S.painted === 'create' && tab !== 'create') keepCreate()
  if (tab === 'create') {
    if (S.painted === 'create' && S.data.create) return   // 새로고침: 입력 중인 폼은 지우지 않는다
    if (!(S.data.create && restoreCreate())) paintCreate()
    S.painted = 'create'; return
  }
  const paint = { supply: paintSupply, review: paintReview, cs: paintCS, uploads: paintUploads, photo: paintPhoto, db: paintDb, log: paintLog }[tab]
  if (tab === 'photo') { paintPhoto(); S.painted = 'photo'; return }
  if (tab === 'db') { paintDb(); S.painted = 'db'; return }
  if (S.data[tab]) { paint(); S.painted = tab }   // 캐시로 먼저 그리고 뒤에서 갱신 (늦게 보이던 문제)
  else if (!quiet) { body.innerHTML = `<div class="empty" style="padding:60px">불러오는 중…</div>`; S.painted = tab }
  let fresh
  try {
    if (tab === 'supply') fresh = await api('supply')
    if (tab === 'review') fresh = { l: await api('listings'), s: await api('signups') }
    if (tab === 'cs') fresh = await api('cs')
    if (tab === 'uploads') fresh = await api('uploads?days=' + (S.upDays || 30))
    if (tab === 'log') fresh = await api('my-log')
  } catch (e) {
    if (S.tab !== tab || seq !== S.loadSeq) return
    if (e.message !== '401') { if (S.data[tab]) toast('새로 불러오지 못했습니다: ' + e.message); else body.innerHTML = `<div class="err">${esc(e.message)}</div>` }
    return
  }
  if (S.tab !== tab || seq !== S.loadSeq) return
  S.data[tab] = fresh; paint(); S.painted = tab
}

function amount(r) {
  if (r.dealType === '매매') return r.sale ? 만(r.sale) : ''
  if (r.deposit != null && r.rent) return 만(r.deposit) + ' / ' + 만(r.rent)
  if (r.deposit != null) return 만(r.deposit)
  return ''
}

async function decideListing(id, action) {
  let note = ''
  if (action === 'reject') {
    note = (prompt('반려 사유를 적어주세요. 올린 중개사에게 그대로 전달됩니다.') || '').trim()
    if (!note) return
  } else if (!confirm('이 매물을 승인해 공급중으로 올립니까?')) return
  try {
    await api('listing-decide', { id, action, note })
    toast(action === 'approve' ? '승인했습니다.' : '반려했습니다.')
    S.data.review = null; await refresh()
  } catch (e) { toast(e.message) }
}

async function decideSignup(id, action, name) {
  const who = name || '이 신청자'
  if (!confirm(action === 'approve' ? `${who} 가입을 승인합니까?` : `${who} 가입을 반려합니까?`)) return
  try {
    await api('signup-decide', { id, action })
    toast(action === 'approve' ? '승인했습니다.' : '반려했습니다.')
    S.data.review = null; await refresh()
  } catch (e) { toast(e.message) }
}

async function viewDoc(id) {
  try {
    const { docs } = await api('signup-doc', { id })
    if (!docs.length) return toast('첨부된 서류가 없습니다.')
    const w = window.open('', '_blank')
    if (!w) return toast('팝업이 막혀 있습니다. 팝업을 허용해주세요.')
    w.document.write(`<!doctype html><meta charset="utf-8"><title>첨부서류</title>
      <body style="margin:0;background:#111;font-family:sans-serif">
      ${docs.map(d => `<div style="padding:10px 14px;color:#fff;font-size:14px">${d.label}
        <a href="${d.url}" target="_blank" style="color:#7dd3fc;margin-left:8px;font-size:12px">새 창</a></div>
        ${/\.pdf(\?|$)/i.test(d.url)
          ? `<iframe src="${d.url}" style="width:100%;height:88vh;border:0;background:#fff"></iframe>`
          : `<img src="${d.url}" style="max-width:100%;display:block">`}`).join('')}`)
    w.document.close()
  } catch (e) { toast(e.message) }
}

async function reveal(id) {
  if (!confirm('임대인 이름·연락처를 엽니까? 누가 언제 열었는지 기록됩니다.')) return
  try {
    const r = await api('reveal', { id })
    const cell = document.getElementById('own-' + id)
    if (cell) cell.innerHTML = `<b>${esc(r.ownerName || '-')}</b><div>${esc(r.ownerPhone || '-')}</div>
      <div class="memo">열람 기록됨</div>`
  } catch (e) { toast(e.message) }
}

/* ── ④ 매물 올리기 (2026-09-28) ─────────────────────────────────────────
   직원이 네이버 링크나 카톡·문자 글을 붙여넣으면 폼을 채우고, 확인 후 [등록]을 누르면
   라운지 매물이 '승인대기'로 들어간다. 검수·승인 탭에서 승인해야 공급중이 된다. */
const DEALS = ['월세', '전세', '매매', '반전세', '단기임대']
const PTYPES = ['주택', '원룸', '투룸', '빌라', '아파트', '오피스텔', '상가', '사무실', '토지', '기타']
const DIRS = ['남향', '남동향', '남서향', '동향', '서향', '북향', '북동향', '북서향']
const F = {}   // 폼 상태

/* 금액: "5000", "5,000", "5천", "1억2000", "12억5000만원", "1,300,000원" → 만원 */
function wonToMan(raw) {
  if (raw == null) return null
  let s = String(raw).replace(/\s+/g, '').replace(/,/g, '')
  if (!s) return null
  let total = 0, matched = false
  const eok = s.match(/(\d+(?:\.\d+)?)억/)
  if (eok) { total += Math.round(parseFloat(eok[1]) * 10000); s = s.slice(s.indexOf('억') + 1); matched = true }
  const cheon = s.match(/(\d+(?:\.\d+)?)천/)
  if (cheon) { total += Math.round(parseFloat(cheon[1]) * 1000); s = s.replace(cheon[0], ''); matched = true }
  const baek = s.match(/(\d+(?:\.\d+)?)백/)
  if (baek) { total += Math.round(parseFloat(baek[1]) * 100); s = s.replace(baek[0], ''); matched = true }
  const man = s.match(/(\d+(?:\.\d+)?)만/)
  if (man) { total += Math.round(parseFloat(man[1])); s = s.replace(man[0], ''); matched = true }
  if (!matched) {
    const plain = s.match(/(\d+(?:\.\d+)?)/)
    if (!plain) return null
    let n = parseFloat(plain[1]); if (n >= 1000000) n = Math.round(n / 10000)   // 원 단위로 적은 경우
    return Math.round(n)
  }
  const rest = s.match(/^(\d{1,4})(?!\d)/); if (rest && !man) total += parseInt(rest[1], 10)
  return total || null
}

/* 월세·관리비: 1억(만원 기준 10,000) 넘는 값은 원 단위로 적은 것 → 만원 (예: 180,000 → 18) */
const smallMoney = v => { const n = wonToMan(v); return (n != null && n >= 10000 && !/만|억/.test(String(v))) ? Math.round(n / 10000) : n }
const KIND_RX = [[/아파트/, '아파트'], [/오피스텔/, '오피스텔'], [/상가|점포|매장/, '상가'], [/사무실|사무소|오피스(?!텔)/, '사무실'],
  [/원룸/, '원룸'], [/투룸|쓰리룸/, '투룸'], [/빌라|다세대|연립/, '빌라'], [/다가구|주택|단독/, '주택'], [/토지|대지|임야/, '토지']]
const guessPType = s => { for (const [rx, v] of KIND_RX) if (rx.test(String(s || ''))) return v; return '' }

/* 카톡·문자 글 → 필드 */
function parseListingText(text) {
  const t = String(text || '').replace(/\r/g, '')
  // 전화번호를 먼저 떼어낸다 — "월세 130 010-1234-5678" 에서 번호 숫자가 금액으로 읽히던 버그(2026-09-30). 워커 normalize.js 와 동일
  const phoneRx = /01[016-9][-.\s]?[0-9]{3,4}[-.\s]?[0-9]{4}|0[2-6][0-9]?[-.\s]?[0-9]{3,4}[-.\s]?[0-9]{4}/g
  const phones = t.match(phoneRx) || []
  const tNoPhone = t.replace(phoneRx, ' ').replace(/복비\s*[+＋:：]?\s*[0-9][0-9.,]*\s*(?:만원|만|%|프로|퍼센트)?/g, ' ')   // '복비+10' 같은 토막은 금액으로 읽지 않는다

  const money = '((?:[0-9][0-9,.]*[ ]*(?:억|천|백|만원|만|원)?[ ]*){1,3})'

    put('deposit', wonToMan(m[1]), '보증금'); put('monthly_rent', smallMoney(m[2]), '월세'); put('deal_type', '월세', '거래유형') }
  if (out.deposit === undefined && (m = oneL.match(new RegExp('보증(?:금)?\\s*[:：]?\\s*' + money)))) put('deposit', wonToMan(m[1]), '보증금')
  if (out.monthly_rent === undefined && (m = oneL.match(new RegExp('월(?:세|임대료)\\s*[:：]?\\s*' + money)))) put('monthly_rent', smallMoney(m[1]), '월세')
  if (out.monthly_rent === undefined && (m = oneL.match(/(?:^|[^0-9])월\s*[:：]?\s*([0-9][0-9,.]*\s*(?:천|백|만원|만))/))) put('monthly_rent', smallMoney(m[1]), '월세')
  if ((m = oneL.match(new RegExp('관리비\\s*[:：]?\\s*' + money)))) put('manage_prc', smallMoney(m[1]), '관리비')
  if ((m = oneL.match(new RegExp('(?:매매|매매가)\\s*[:：]?\\s*' + money)))) { put('sale_price', wonToMan(m[1]), '매매가'); put('deal_type', '매매', '거래유형') }
  if (out.deal_type === undefined) {
    if ((m = oneL.match(new RegExp('전세\\s*[:：]?\\s*' + money)))) { put('deposit', wonToMan(m[1]), '보증금'); put('deal_type', '전세', '거래유형') }
    else if (out.monthly_rent != null) put('deal_type', '월세', '거래유형')
    else if (/단기/.test(one)) put('deal_type', '단기임대', '거래유형')
  }
  if (out.deposit === undefined && out.sale_price === undefined && (m = oneL.match(/(?:^|[\s(])([0-9][0-9,]{2,5})\s*\/\s*([0-9][0-9,]{1,4})(?![0-9])/))) {
    put('deposit', wonToMan(m[1]), '보증금'); put('monthly_rent', wonToMan(m[2]), '월세'); put('deal_type', '월세', '거래유형') }
  if ((m = one.match(/(?:^|[\s,(])(반지하|지하\s*([0-9]{1,2})\s*층|b\s*([0-9]{1,2})\s*층)/i))) put('floor_no', m[1].match(/반지하/) ? -1 : -parseInt(m[2] || m[3], 10), '층')
  if (out.floor_no === undefined && (m = one.match(/(?:^|[\s,(])([0-9]{1,2})\s*층/))) put('floor_no', parseInt(m[1], 10), '층')
  if ((m = one.match(/([0-9]{1,2})\s*층\s*\/\s*([0-9]{1,2})\s*층?/)) || (m = one.match(/총\s*([0-9]{1,2})\s*층/))) put('total_floors', parseInt(m[2] || m[1], 10), '총층')
  if ((m = one.match(/([0-9]{1,4}[A-Za-z]?)\s*호(?![수실])/))) put('ho_nm', m[1] + '호', '호수')
  if ((m = one.match(/(?:^|[\s,(])([0-9]{1,3})\s*동(?![호산])/))) put('dong_nm', m[1] + '동', '동')

  if (/주차\s*[:：]?\s*(가능|있음|O\b)/.test(one)) put('is_parking', 'Y', '주차'); else if (/주차\s*[:：]?\s*(불가|없음|X\b|안\s*됨)/.test(one)) put('is_parking', 'N', '주차')
  if (/반려\s*동물\s*[:：]?\s*(가능|상담|협의|O\b)/.test(one)) put('is_pet', 'Y', '반려동물'); else if (/반려\s*동물\s*[:：]?\s*(불가|없음|X\b|안\s*됨)/.test(one)) put('is_pet', 'N', '반려동물')
  if ((m = one.match(/(?:욕실|화장실)\s*([0-9])/))) put('bathroom_count', parseInt(m[1], 10), '욕실')
  for (const d of DIRS) if (one.includes(d)) { put('direction', d, '향'); break }
  const mobile = phones.find(p => /^01[016-9]/.test(p))
  if (mobile || phones[0]) put('owner_phone', (mobile || phones[0]).replace(/[.\s]/g, '-'), '연락처')
  put('property_type', guessPType(one), '종류')
  const addrLine = t.split('\n').find(l => /(로|길)\s*[0-9]+(-[0-9]+)?/.test(l) || /[가-힣]{2,10}동\s*[0-9]+(-[0-9]+)?/.test(l)) || one
  if ((m = addrLine.match(/([가-힣A-Za-z0-9]+(?:로|길)\s*[0-9]+(?:-[0-9]+)?)/))) put('address_q', m[1].replace(/\s+/g, ''), '주소')
  if (out.address_q === undefined && (m = addrLine.match(/([가-힣]{2,10}동\s*[0-9]+(?:-[0-9]+)?)/))) put('address_q', m[1], '주소')
  if ((m = one.match(/([가-힣A-Za-z0-9]{2,20}(?:아파트|빌라|타워|캐슬|팰리스|자이|푸르지오|래미안|힐스테이트|아이파크|e편한세상|더샵|빌딩|프라자|플라자|오피스텔))/))) put('bd_nm', m[1], '건물명')
  const firstLine = t.trim().split('\n')[0].trim()
  if (firstLine && firstLine.length <= 40) put('headline', firstLine, '제목')
  out.description = tNoPhone.replace(/[ \t]+\n/g, '\n').replace(/[ \t]{2,}/g, ' ').trim().slice(0, 2000)   // 설명에는 전화번호를 남기지 않는다(연락처 칸에만)
  return out
}

/* 엑셀 한 줄(탭 구분) → 필드. 수집기 엑셀에서 머리글까지 복사하면 머리글로 맞추고, 값만이면 칸 생김새로 판단 */
const XL_HEADERS = [
  [/매물번호|매물_URL|링크|url/i, 'url'], [/^(도로명주소|지번주소|주소|세부주소|매물지역|소재지|전체주소|지번)$/, 'address'], [/^(호수|호)$/, 'unit'],
  [/아파트동|^동$/, 'dong'], [/거래(방식|유형)/, 'deal'], [/매매\/전세금|매매가|보증금|전세금/, 'deposit_or_price'], [/^(월세|전세|매매|단기)$/, 'deal_col'],
  [/관리비/, 'mgmt'], [/전용|면적/, 'area'], [/해당층|^층수?$/, 'floor'], [/전체층|최고층|총층/, 'total_floor'], [/방수/, 'rooms'], [/화장실|욕실/, 'baths'],
  [/^(설명|상세_?내용|상세설명|비고|메모)$/, 'memo'], [/간략설명|제목|매물명/, 'headline'], [/휴대폰|임대인.*(연락처|전화)|^연락처$/, 'phone'],
  [/연락처_?관계|연락처\s*구분|관계$/, 'rel'], [/중개사전화|전화/, 'phone2'], [/종류|매물유형|건물유형/, 'kind'], [/_태그$/, 'tags'], [/건물명/, 'building'], [/향$/, 'facing'],
  [/입주/, 'movein'], [/^(주차|엘리베이터|옵션|권리금|물건번호|사용승인일|준공)$/, 'extra'],
]
const isExcelPaste = s => /\t/.test(String(s || ''))
function parseExcelRows(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').filter(l => l.trim())
  if (!lines.length) return parseListingText(text)
  const cells = lines.map(l => l.split('\t').map(c => c.trim()))
  const headerHits = cells[0].filter(c => XL_HEADERS.some(([rx]) => rx.test(c))).length
  const hasHeader = cells.length >= 2 && headerHits >= 3
  const out = { _fields: [], _source: 'excel' }
  const put = (k, v, label) => { if (v == null || v === '') return; if (out[k] !== undefined) return; out[k] = v; out._fields.push(label || k) }
  const firstNum = s => { const m = String(s || '').replace(/,/g, '').match(/-?[0-9]+(?:\.[0-9]+)?/); return m ? parseFloat(m[0]) : null }
  const normDeal = w => /매매/.test(w) ? '매매' : /전세/.test(w) ? '전세' : /단기/.test(w) ? '단기임대' : /반전세/.test(w) ? '반전세' : /월세/.test(w) ? '월세' : ''
  if (hasHeader) {
    const head = cells[0], row = cells[1]
    let dealWord = ''; head.forEach((h, i) => { if (/거래(방식|유형)/.test(h)) dealWord = row[i] || '' })
    const deal = normDeal(dealWord); put('deal_type', deal, '거래유형')
    let phone2 = ''; const extras = []
    const parseFloor = s => { s = String(s || '').trim(); if (!s) return null; if (/^b|지하/i.test(s)) return -(firstNum(s) || 1); if (/반지/.test(s)) return -1; const n = firstNum(s); return n === null ? null : Math.round(n) }
    head.forEach((h, i) => {
      const v = row[i]; if (v === undefined || v === '') return
      const hit = XL_HEADERS.find(([rx]) => rx.test(h)); if (!hit) return
      switch (hit[1]) {
        case 'url': if (/https?:\/\//.test(v)) out.url = v; break
        case 'address': if (!/중개사/.test(h)) put('address_q', v.split(',')[0].trim(), '주소'); break   // "서울 강남구 논현동 87-2, 3층 3층전체" → 쉼표 앞
        case 'unit': put('ho_nm', /호$/.test(v) ? v : v + '호', '호수'); break
        case 'dong': put('dong_nm', /동$/.test(v) ? v : v + '동', '동'); break
        case 'deposit_or_price': { const n = wonToMan(v); if ((out.deal_type || deal) === '매매') put('sale_price', n, '매매가'); else put('deposit', n, '보증금'); break }
        case 'deal_col': {   // 온하우스 엑셀: 열 이름이 거래유형(월세/전세/매매/단기), 값 "20,000 / 1,200" — 네이버 엑셀의 '월세' 숫자 열도 여기로 온다
          const dealH = normDeal(h); if (out.deal_type === undefined) put('deal_type', dealH, '거래유형')
          if (v.includes('/')) { const [a, b] = v.split('/'); put('deposit', wonToMan(a), '보증금'); put('monthly_rent', smallMoney(b), '월세') }
          else if (dealH === '매매') put('sale_price', wonToMan(v), '매매가')
          else if (dealH === '전세') put('deposit', wonToMan(v), '보증금')
          else put('monthly_rent', smallMoney(v), '월세')
          break }
        case 'mgmt': put('manage_prc', smallMoney(v), '관리비'); break
        case 'area': {   // "임대386.8 / 117전용297.5 / 90"(온하우스, ㎡/평) · "45.2"(㎡) · 평 단위 머리글
          const ex = v.match(/전용\s*([0-9.]+)/), sp = v.match(/임대\s*([0-9.]+)/)
          if (ex) put('area_exclusive', parseFloat(ex[1]), '면적')
          if (sp) put('area_supply', parseFloat(sp[1]), '공급면적')
          if (!ex && !sp) { const n = firstNum(v); if (n) put('area_exclusive', /평/.test(h) && !/㎡/.test(v) ? +(n * 3.3058).toFixed(2) : n, '면적') }
          break }
        case 'floor': {   // "3 / 6"(해당층 / 전체층) · "B2" · "3"
          const [a, b] = v.split('/'); const f = parseFloor(a); if (f !== null) put('floor_no', f, '층')
          if (b !== undefined) { const t = parseFloor(b); if (t !== null) put('total_floors', Math.abs(t), '총층') }
          break }
        case 'total_floor': { const n = firstNum(v); if (n !== null) put('total_floors', Math.round(n), '총층'); break }
        case 'rooms': { const [a, b] = v.split('/'); const r = firstNum(a); if (r !== null) put('room_count', Math.round(r), '방수'); if (b !== undefined) { const bb = firstNum(b); if (bb !== null) put('bathroom_count', Math.round(bb), '욕실') } break }
        case 'baths': { const n = firstNum(v); if (n !== null) put('bathroom_count', Math.round(n), '욕실'); break }
        case 'memo': put('description', v, '설명'); break
        case 'headline': put('headline', v, '제목'); break
        case 'phone': out.owner_phone = v; if (!out._fields.includes('연락처')) out._fields.push('연락처'); break
        case 'phone2': phone2 = v; break
        case 'rel': { const r = ROLE_OF(v); if (r) put('contact_role', r, '연락처 구분'); break }
        case 'kind': put('property_type', guessPType(v) || v, '종류'); break
        case 'tags': { const k = guessPType(v); if (k) put('property_type', k, '종류'); const y = v.match(/(?:19|20)\d{2}(?=년)/); if (y) extras.push('준공: ' + y[0] + '년'); break }
        case 'building': put('bd_nm', v, '건물명'); break
        case 'facing': if (DIRS.includes(v)) put('direction', v, '향'); break
        case 'movein': { const d = moveInDate(v); if (d) put('available_date', d, '입주가능일'); extras.push('입주: ' + v); break }
        case 'extra': extras.push(h + ': ' + v); break
      }
    })
    if (!out.owner_phone && phone2) put('owner_phone', phone2, '연락처')
    if (out.headline === undefined) { const hl = [out.bd_nm, out.ho_nm || (out.floor_no != null ? (out.floor_no < 0 ? 'B' + (-out.floor_no) : out.floor_no) + '층' : ''), out.property_type, out.deal_type].filter(Boolean).join(' '); if (hl) put('headline', hl.slice(0, 40), '제목') }
    out.description = [out.description, ...extras, '엑셀 한 줄에서 정리'].filter(Boolean).join('\n').slice(0, 2000)
    return out
  }
  const row = cells[0]; const nums = []
  for (const c of row) {
    if (!c) continue
    if (/https?:\/\//.test(c)) { if (!out.url) out.url = c; continue }
    if (/(01[016-9]|0[2-6][0-9]?)[-.\s]?[0-9]{3,4}[-.\s]?[0-9]{4}/.test(c)) { put('owner_phone', c.match(/(0[0-9]{1,2}[-.\s]?[0-9]{3,4}[-.\s]?[0-9]{4})/)[1].replace(/[.\s]/g, '-'), '연락처'); continue }
    if (/^(매매|전세|월세|반전세|단기임대|단기)$/.test(c)) { put('deal_type', normDeal(c), '거래유형'); continue }
    if (/^[0-9]{1,4}[A-Za-z]?호$/.test(c)) { put('ho_nm', c, '호수'); continue }
    if (/^[0-9]{1,3}동$/.test(c)) { put('dong_nm', c, '동'); continue }
    if (/^(b|지하)?\s*-?[0-9]{1,2}\s*층$/i.test(c)) { const n = firstNum(c); put('floor_no', /^b|지하/i.test(c) ? -Math.abs(n) : n, '층'); continue }
    if (/[0-9](㎡|m2|평)/.test(c)) { const n = firstNum(c); put('area_exclusive', /평/.test(c) ? +(n * 3.3058).toFixed(2) : n, '면적'); continue }
    if (/(로|길)\s*[0-9]+(-[0-9]+)?|[가-힣]{2,10}동\s*[0-9]+(-[0-9]+)?/.test(c) && !/중개/.test(c)) { put('address_q', c, '주소'); continue }
    if (guessPType(c) && c.length <= 8) { put('property_type', guessPType(c), '종류'); continue }
    if (/^[0-9][0-9,]*(만원|만)?$/.test(c)) { nums.push(wonToMan(c)); continue }
  }
  const longest = row.filter(c => c && c.length > 12 && !/https?:\/\//.test(c)).sort((a, b) => b.length - a.length)[0]
  if (longest) put('description', longest, '설명')
  if (nums.length) {
    if (out.deal_type === '매매') put('sale_price', nums[0], '매매가')
    else { const s = nums.slice().sort((a, b) => b - a); put('deposit', s[0], '보증금'); if (nums.length > 1) { put('monthly_rent', s[1], '월세'); if (out.deal_type === undefined) put('deal_type', '월세', '거래유형') } if (nums.length > 2) put('manage_prc', s[2], '관리비') }
  }
  out.description = [out.description, '엑셀 한 줄에서 정리'].filter(Boolean).join('\n').slice(0, 2000)
  return out
}

const articleNoFromUrl = u => { const s = String(u || ''); const m = s.match(/articleNo=([0-9]{6,})/) || s.match(/land\.naver\.com\/article(?:s|\/info)?\/([0-9]{6,})/); return m ? m[1] : '' }
const DESC_DROP = /^(\[(네이버|당근|온하우스)\]|물건번호\s*No|확인일\s*[:：]|등록일\s*[:：]|원문\s*[:：]|수집일시|주소\s*[:：]|면적\s*(\(|[:：])|층\s*[:：]|[가-힣]+(구|시|군)\s+[가-힣0-9]+(동|읍|면|가|리)\s+[0-9]+(-[0-9]+)?)/
const cleanDesc = t => String(t || '').split('\n').map(l => l.trim()).filter(l => l && !DESC_DROP.test(l)).join('\n')
const ROLE_OF = v => { v = String(v || '').trim(); return /세입|임차/.test(v) ? 'tenant' : /관리/.test(v) ? 'manager' : /임대|집주|소유|주인|landlord/i.test(v) ? 'landlord' : '' }
const firstUrl = s => (String(s || '').match(/https?:\/\/[^\s"'<>]+/) || [])[0] || ''

/* 링크 → 워커가 읽어온 값을 폼 필드로. 네이버·당근은 구조화, 그 밖의 사이트는 페이지 글을 텍스트 파서로 */
async function parseListingUrl(url) {
  const api = String(CONFIG.PARSE_API || '').trim()
  if (!api) throw new Error('링크 정리 서버(PARSE_API)가 설정되지 않았습니다.')
  const u = new URL(api); u.searchParams.set('url', url)
  const r = await fetch(u.toString(), { headers: { Accept: 'application/json' } })
  const j = await r.json().catch(() => null)
  if (!r.ok || !j || j.error) throw new Error((j && j.error) || `링크를 읽지 못했습니다 (${r.status})`)
  if (j._source === 'generic') {
    const got = parseListingText([j.title, j.description, j.text].filter(Boolean).join('\n'))
    got._source = 'generic'; got.source_url = j.source_url; got.note = j.note

/* 무엇을 붙여넣든: 엑셀 한 줄 → 링크 → 글 */
async function parsePasted(raw) {
  const s = String(raw || '').trim()
  if (!s) throw new Error('붙여넣은 내용이 없습니다.')
  if (isExcelPaste(s)) {
    const got = parseExcelRows(s)
    if (got.url) {   // 엑셀 줄에 링크가 있으면 링크로 더 정확히 읽고, 엑셀 값으로 빈 곳을 채운다
      try { const fromUrl = await parseListingUrl(got.url)
        for (const k of Object.keys(got)) { if (k.startsWith('_') || k === 'url') continue; if (fromUrl[k] == null || fromUrl[k] === '') fromUrl[k] = got[k] }
        fromUrl._fields = [...new Set([...(fromUrl._fields || []), ...got._fields])]; fromUrl._source = fromUrl._source + '+excel'; return fromUrl }
      catch (e) { got.note = '링크는 못 읽었고 엑셀 값만 정리했습니다: ' + e.message }
    }
    return got
  }
  const url = firstUrl(s)
  if (url) return mergeLinkText(await parseListingUrl(url), s)
  return parseListingText(s)
}
/** 링크 뒤에 같이 적은 글("https://… 010-1234-5678 501호 보증금 5000")도 정리해서 링크에 없던 칸(연락처 등)을 채운다 */
function mergeLinkText(fromUrl, s) {
  const rest = String(s || '').replace(/https?:\/\/[^\s"'<>]+/g, ' ').replace(/\s+/g, ' ').trim()
  if (rest.length < 4) return fromUrl
  let extra = null; try { extra = parseListingText(rest) } catch (_) { return fromUrl }
  if (!extra) return fromUrl
  const SKIP = new Set(['description', 'headline', 'source_url', 'photos', 'url'])
  let added = false
  for (const k of Object.keys(extra)) { if (k.startsWith('_') || SKIP.has(k)) continue; if (fromUrl[k] == null || fromUrl[k] === '') { fromUrl[k] = extra[k]; added = true } }
  if (added) { fromUrl._fields = [...new Set([...(fromUrl._fields || []), ...(extra._fields || [])])]; fromUrl._source = String(fromUrl._source || '') + '+text' }
  return fromUrl
}

  if ((m = t.match(/(\d{1,2})\s*월\s*(초|중순|말)/))) { const d = new Date(today.getFullYear(), +m[1] - 1, m[2] === '초' ? 1 : m[2] === '중순' ? 15 : 28); if (d < today) d.setFullYear(d.getFullYear() + 1); return ymd(d) }

    const body = {
      road_addr: $('c_road_addr').value, jibun_addr: txt('c_jibun_addr'), bd_nm: txt('c_bd_nm'), dong_nm: txt('c_dong_nm'), ho_nm: txt('c_ho_nm'),
      deal_type: $('c_deal_type').value, sale_price: num('c_sale_price'), deposit: num('c_deposit'), monthly_rent: num('c_monthly_rent'), manage_prc: num('c_manage_prc'),
      property_type: txt('c_property_type'), room_type: txt('c_room_type'), building_use: BLDG.floorUse || undefined, floor_no: num('c_floor_no'), total_floors: num('c_total_floors'),
      area_exclusive: num('c_area_exclusive'), area_supply: num('c_area_supply'), room_count: num('c_room_count'), bathroom_count: num('c_bathroom_count'),
      direction: txt('c_direction'), available_date: txt('c_available_date'), owner_name: txt('c_owner_name'), owner_phone: txt('c_owner_phone'), contact_role: $('c_contact_role').value || 'landlord', parking_total: num('c_parking_total'),
      is_parking: txt('c_is_parking'), is_pet: txt('c_is_pet'), headline: txt('c_headline'), description: txt('c_description'), special_notes: txt('c_special_notes'),
      photos: $('c_photos').value.split('\n').map(s => s.trim()).filter(s => /^https?:\/\//.test(s)),
      hq_kind: $('c_hq_kind').value, source_url: F.source_url, force: F.force === true,
    }
    if (body.area_exclusive !== undefined && !(body.area_exclusive > 0)) body.area_exclusive = undefined   // 0 은 없는 값
    if (F.daangn === true && F.daangnOnly === true) {   // 🥕 당근만: 라운지에 저장하지 않고 당근에만 (라운지 매물과 별개)

      $('csubmit').disabled = true; $('cstat').textContent = '당근에만 올리는 중… (라운지 저장 없음, 20초 안팎)'
      DG.batch = Date.now(); dgStart(1); dgNow(`${body.road_addr} ${body.ho_nm || ''} — 당근에 올리는 중 (당근만)`)
      const label = [body.jibun_addr || body.road_addr, body.dong_nm, body.ho_nm].filter(Boolean).join(' ')
      try {
        const r = await api('daangn-direct', body)
        const no = dgArticleNo(r.url, r.articleId, r.articleNo); dgPush({ ok: true, label, url: r.url || '', no, direct: true }); dgEnd()
        toast('당근에 올렸습니다 (라운지에는 저장하지 않음)')
        F.force = false; F.source_url = ''; S.data.create = null; paintCreate()
        $('cmsg').innerHTML = `<b style="color:#ff6f0f">🥕 당근에만 등록 완료</b> ${esc(label)}${no ? ' (광고번호 ' + esc(no) + ')' : ''}${r.url ? ` — <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>` : ''} · 라운지 매물에는 저장하지 않았습니다.`
      } catch (err) {
        if (err.code === 'daangn_dup') { dgPush({ ok: false, dup: true, no: dgArticleNo(err.data?.url, err.data?.articleId, err.data?.articleNo), url: err.data?.url || '', label, msg: err.message }); dgEnd(); $('cmsg').innerHTML = `<b style="color:#b45309">⏭ 당근 중복</b> — ${esc(err.message)}${err.data?.url ? ` <a href="${esc(err.data.url)}" target="_blank" rel="noopener">보기</a>` : ''}`; toast('이미 당근에 올라간 매물이라 건너뜁니다') }
        else { dgPush({ ok: false, label, msg: err.message }); dgEnd(); $('cmsg').innerHTML = `<span style="color:var(--warn)">당근 등록 실패: ${esc(err.message)}</span>`; if (err.message !== '401') toast('당근 등록 실패') }

    try {

      const wantDaangn = F.daangn === true, onlyDaangn = wantDaangn && F.daangnOnly === true; F.daangn = false; F.daangnOnly = false
      toast(onlyDaangn ? '라운지에는 보관용으로만 저장했습니다(미노출). 당근에 올립니다…' : '승인대기로 등록했습니다. 검수·승인 탭 맨 위(직원 등록)에 뜹니다.')
      S.data.review = null
      if (BULK.formRow) { const br = BULK.rows.find(x => x.n === BULK.formRow); if (br) { br.status = 'done'; br.msg = '폼에서 등록'; if (r.row?.id) br.id = r.row.id } BULK.formRow = null }
      F.force = false; F.source_url = ''; S.data.create = null; paintCreate()
      $('cmsg').innerHTML = onlyDaangn ? `<b>당근 전용</b> ${esc(r.row?.road_addr || '')} — 라운지에는 보관용(미노출)으로만 저장` : `<b>등록 완료</b> ${esc(r.row?.road_addr || '')} → 승인대기 (검수·승인 탭 맨 위 '직원 등록', 라운지 어드민 hq-listings 승인 대기 상자에도 뜸). 이어서 다른 매물을 붙여넣으세요.`
      if (wantDaangn && r.row?.id) await daangnPublish(r.row)
      refresh()
    } catch (err) {
      const m = String(err.message || '')
      if (!/이미 있습니다/.test(m)) { F.daangn = false; F.daangnOnly = false }
      if (/이미 있습니다/.test(m) && !F.force) {
        $('cstat').innerHTML = `${esc(m)} <button type="button" class="btn no" id="cforce">중복이어도 등록</button>`
        document.getElementById('cforce').onclick = () => { F.force = true; $('cform').requestSubmit() }
      } else $('cstat').textContent = m
    } finally { $('csubmit').disabled = false; if (!/이미 있습니다/.test($('cstat').textContent)) setTimeout(() => { if ($('cstat')) $('cstat').textContent = '' }, 6000) }
  }
}

/* 새 버전 감지: 열어 둔 화면이 옛 버전이면 띠를 띄운다 (배포 때 BUILD 도장이 바뀜 — 배포_인트라넷.sh) */

/* ── 당근 연결 (QR 로그인) — 라이선스 서버가 엔진에 QR 세션을 열고, 성공하면 사용자별 당근 세션을 서버에 보관 ── */
const DGC = { sid: '', timer: null, qr: '', state: '', msg: '' }
function paintDgConn() {
  const box = document.getElementById('dgconn'); if (!box) return
  const d = (S.me && S.me.daangn) || {}
  const hc = document.getElementById('hconn'); if (hc) hc.innerHTML = d.connected ? `<span style="color:#c2410c">🥕 ${esc(d.name || d.phone || '연결됨')}</span>` : `<span style="color:var(--dim)">🥕 당근 미연결</span>`
  if (DGC.state === 'qr' || DGC.state === 'mfa') {
    box.innerHTML = `<div style="font-weight:800">🥕 당근 연결 <span style="font-weight:400;color:var(--dim);font-size:12px">당근 앱 → 나의 당근 → 오른쪽 위 QR 아이콘으로 아래 QR 을 찍어주세요 (2분 안에)</span></div>
      <div style="display:flex;gap:16px;align-items:flex-start;margin-top:8px;flex-wrap:wrap">
        ${DGC.qr ? `<img src="data:image/png;base64,${DGC.qr}" alt="당근 로그인 QR" style="width:200px;height:200px;border:1px solid var(--line);border-radius:8px;background:#fff">` : ''}
        <div style="flex:1;min-width:200px"><div id="dgc_msg">${esc(DGC.msg || '앱에서 QR 을 찍으면 자동으로 연결됩니다…')}</div>
        ${DGC.state === 'mfa' ? '<div style="color:#b45309;margin-top:6px">당근 앱에 뜬 추가 인증(2단계)을 승인해 주세요.</div>' : ''}
        <div class="row-acts" style="margin-top:10px"><button class="btn" id="dgc_cancel">취소</button></div></div></div>`
    document.getElementById('dgc_cancel').onclick = () => dgcStop(true)
    return
  }
  box.innerHTML = d.connected
    ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="color:#c2410c">🥕 당근 연결됨</b><span>${esc([d.name, d.phone ? phone10(d.phone) : '', d.broker].filter(Boolean).join(' · '))}</span><span style="color:var(--dim);font-size:12px">${esc(dt(d.connected_at))} 연결</span><div class="grow"></div><button class="btn" id="dgc_re">다시 연결</button><button class="btn no" id="dgc_off">연결 해제</button></div>${DGC.msg ? `<div class="hint" style="margin:6px 0 0;color:var(--warn)">${esc(DGC.msg)}</div>` : ''}`
    : `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>🥕 당근이 연결되어 있지 않습니다</b><span style="color:var(--dim);font-size:12.5px">본인 당근 계정으로 QR 로그인하면 그 계정으로 광고가 올라갑니다 (당근 쪽에서 로그아웃되면 다시 연결).</span><div class="grow"></div><button class="btn b" id="dgc_start" style="background:#ff6f0f;border-color:#ff6f0f">당근 연결 (QR)</button></div>${DGC.msg ? `<div class="hint" style="margin:6px 0 0;color:var(--warn)">${esc(DGC.msg)}</div>` : ''}`
  const st = document.getElementById('dgc_start') || document.getElementById('dgc_re'); if (st) st.onclick = dgcStart
  const off = document.getElementById('dgc_off'); if (off) off.onclick = async () => { if (!confirm('당근 연결을 해제할까요? 다시 QR 로 연결할 수 있습니다.')) return; try { await api('daangn-disconnect', {}); S.me.daangn = { connected: false }; DGC.msg = ''; paintDgConn(); toast('연결을 해제했습니다') } catch (e) { toast(e.message) } }
}
async function dgcStart() {
  DGC.msg = 'QR 을 준비하는 중… (10초 안팎)'; DGC.state = 'qr'; DGC.qr = ''; paintDgConn()
  try {
    const r = await api('daangn-connect', { step: 'start' })
    if (!r.session_id) throw new Error(r.error || 'QR 시작 실패')
    DGC.sid = r.session_id; DGC.qr = r.qr_image || ''; DGC.msg = ''; paintDgConn()
    clearInterval(DGC.timer); DGC.timer = setInterval(dgcPoll, 2500)
  } catch (e) { DGC.state = ''; DGC.msg = e.message === '401' ? '' : 'QR 준비 실패: ' + e.message; paintDgConn() }
}
let dgcBusy = false
async function dgcPoll() {
  if (!DGC.sid) return dgcStop(false)
  if (dgcBusy) return; dgcBusy = true
  try {
    const r = await api('daangn-connect', { step: 'poll', session_id: DGC.sid })
    if (r.status === 'success') { dgcStop(false); DGC.msg = ''; try { S.me = await api('summary') } catch (_) {} ; paintDgConn(); toast('당근이 연결되었습니다'); return }
    if (r.status === 'mfa_pending') { if (DGC.state !== 'mfa') { DGC.state = 'mfa'; paintDgConn() } return }
    if (r.qr_image && r.qr_image !== DGC.qr) { DGC.qr = r.qr_image; paintDgConn() }
    if (r.status && r.status !== 'pending') { dgcStop(false); DGC.msg = r.error || ('연결 실패: ' + r.status); paintDgConn() }
  } catch (e) { dgcStop(false); if (e.message !== '401') { DGC.msg = '연결 실패: ' + e.message; paintDgConn() } }
  finally { dgcBusy = false }
}
function dgcStop(cancel) {
  clearInterval(DGC.timer); DGC.timer = null
  if (cancel && DGC.sid) api('daangn-connect', { step: 'cancel', session_id: DGC.sid }).catch(() => {})
  DGC.sid = ''; DGC.state = ''; DGC.qr = ''; if (cancel) { DGC.msg = ''; paintDgConn() }
}

    </div>`
  const $p = id => document.getElementById(id)
  $p('ph_fixh').onchange = () => { $p('ph_h').disabled = !$p('ph_fixh').checked }
  const log = s => { const e = $p('ph_log'); if (!e) return; e.textContent += s + '\n'; e.scrollTop = e.scrollHeight }
  const bar = p => { const e = $p('ph_bar'); if (e) e.style.width = Math.max(0, Math.min(100, p)) + '%' }
  const status = s => { const e = $p('ph_status'); if (e) e.textContent = s }
  const links = () => { const out = [], seen = {}; $p('ph_links').value.split(/[\s,;]+/).forEach(t => { t = t.trim(); if (/^https?:\/\//.test(t) && !seen[t]) { seen[t] = 1; out.push(t) } }); return out }
  const imgUrl = (u, ref) => CONFIG.API_BASE + '/photos-img?u=' + encodeURIComponent(u) + (ref ? '&r=' + encodeURIComponent(ref) : '') + '&token=' + encodeURIComponent(token())
  const loadImg = (u, ref) => new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => bad(new Error('load')); im.src = imgUrl(u, ref) })
  const resize = (im, w, h, q) => { const cw = w, ch = h > 0 ? h : Math.max(1, Math.round(im.naturalHeight * w / im.naturalWidth)); const c = document.createElement('canvas'); c.width = cw; c.height = ch; const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'
    if (h > 0) { const s = Math.max(cw / im.naturalWidth, ch / im.naturalHeight), dw = im.naturalWidth * s, dh = im.naturalHeight * s; x.drawImage(im, (cw - dw) / 2, (ch - dh) / 2, dw, dh) } else x.drawImage(im, 0, 0, cw, ch)
    return new Promise(ok => c.toBlob(b => ok({ blob: b, w: cw, h: ch }), 'image/jpeg', q / 100)) }
  const save = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 2000) }
  const ensureZip = () => window.JSZip ? Promise.resolve() : new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = ok; s.onerror = () => bad(new Error('zip 라이브러리를 불러오지 못했습니다')); document.head.appendChild(s) })
  $p('ph_stop').onclick = () => { PH.stop = true }
  $p('ph_go').onclick = async () => {
    if (PH.running) return
    const urls = links(); if (!urls.length) return toast('매물 링크를 넣어주세요')
    PH.running = true; PH.stop = false; $p('ph_go').disabled = true; $p('ph_stop').disabled = false; $p('ph_log').textContent = ''; $p('ph_thumbs').innerHTML = ''; bar(0)
    const w = parseInt($p('ph_w').value) || 950, h = $p('ph_fixh').checked ? (parseInt($p('ph_h').value) || 0) : 0, q = parseInt($p('ph_q').value) || 92, perLink = $p('ph_onezip').checked
    const done_ = () => { PH.running = false; const g = $p('ph_go'), s = $p('ph_stop'); if (g) g.disabled = false; if (s) s.disabled = true }
    try {
      await ensureZip()
      status('사진 주소 모으는 중…'); let items = []
      for (let ci = 0; ci < urls.length; ci += 20) {
        status(`사진 주소 모으는 중… ${Math.min(ci + 20, urls.length)}/${urls.length}개 링크`)
        const res = await api('photos-collect', { urls: urls.slice(ci, ci + 20) }); items = items.concat(res.items || [])
      }
      let total = 0; items.forEach(it => { if (it.ok) total += it.photos.length }); let done = 0, savedN = 0
      const allZip = perLink ? null : new JSZip()
      for (let i = 0; i < items.length; i++) {
        const it = items[i]; if (PH.stop) { log('중단'); break }
        log(`[${i + 1}/${items.length}] ${it.url}`)
        if (!it.ok) { log('  오류: ' + it.error); continue }
        if (!it.photos.length) { log('  사진 주소를 찾지 못했습니다'); continue }
        log(`  사진 후보 ${it.photos.length}장 → ${it.label}`)
        const zip = perLink ? new JSZip() : allZip.folder(it.label); let n = 0
        for (let k = 0; k < it.photos.length; k++) {
          if (PH.stop) break; const u = it.photos[k]
          try { const im = await loadImg(u, it.referer); if (it.site === 'generic' && Math.min(im.naturalWidth, im.naturalHeight) < 400) { done++; bar(done / total * 100); continue }
            const r = await resize(im, w, h, q); n++; const name = (n < 10 ? '0' : '') + n + '.jpg'; zip.file(name, r.blob)
            log(`    [${name}] ${im.naturalWidth}x${im.naturalHeight} → ${r.w}x${r.h}`)
            const th = $p('ph_thumbs'); if (th && th.children.length < 60) { const t = document.createElement('img'); t.src = URL.createObjectURL(r.blob); t.style.cssText = 'width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line)'; th.appendChild(t) }
          } catch (e) { log('    내려받기 실패: ' + u.slice(0, 90)) }
          done++; bar(done / total * 100); status(`${done}/${total}장`)
        }
        if (perLink && n) { const b = await zip.generateAsync({ type: 'blob' }); save(b, it.label + '.zip'); savedN += n; log(`  저장 ${n}장 → ${it.label}.zip`) }
        else if (!perLink) savedN += n
      }
      if (!perLink && savedN) { const b2 = await allZip.generateAsync({ type: 'blob' }); save(b2, '매물사진950_' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.zip'); log(`저장 ${savedN}장 → 한 zip`) }
      status(`완료 — 사진 ${savedN}장`); bar(100)
    } catch (e) { log('오류: ' + e.message); status('실패: ' + e.message); if (e.message !== '401') toast(e.message) }
    finally { done_() }
  }
}

/* ── 지번 조회 (기능 db): /db 와 같은 규칙 — 지번(동+번지)만, 5건까지, 조회 기록 남음 */
function paintDb() {
  S.painted = 'db'
  if (document.getElementById('db_q')) return
  document.getElementById('body').innerHTML = `
    <div class="paste" style="border-color:#f6b4cf;background:#fff4f8">
      <div style="font-weight:800">🔎 지번 조회 <span style="font-weight:400;color:var(--dim);font-size:12px">지번(예: 논현동 124-12 또는 124-12)을 치면 매물·임대인 DB 에서 바로 찾습니다. 5건까지 보이고 조회 기록이 남습니다.</span></div>
      <div class="row-acts" style="align-items:center"><input id="db_q" placeholder="예: 논현동 124-12 302호" autocomplete="off" style="flex:1;min-width:240px;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px"><button class="btn b" id="db_go">찾기</button><span class="hint" id="db_msg" style="margin:0">치는 대로 바로 찾습니다.</span></div>
      <div id="db_res" style="margin-top:10px;overflow-x:auto"></div>
    </div>`
  const $d = id => document.getElementById(id)
  let t = null, last = ''
  const lookup = async () => {
    const q = $d('db_q').value.trim(); const res = $d('db_res'), msg = $d('db_msg')
    if (q.length < 2) { res.innerHTML = ''; msg.textContent = '치는 대로 바로 찾습니다.'; return }
    if (q === last) return; last = q; msg.textContent = '찾는 중…'
    try {
      const r = await api('db-lookup?q=' + encodeURIComponent(q))
      if ($d('db_q').value.trim() !== q) return
      if (r.error) { res.innerHTML = `<div class="hint" style="color:var(--warn)">${esc(r.error)}</div>`; msg.textContent = ''; return }
      if (!r.rows.length) { res.innerHTML = `<div class="hint">"${esc(q)}" 에 해당하는 줄이 없습니다.</div>`; msg.textContent = '0건'; return }
      res.innerHTML = `<div class="card scroll"><table><thead><tr><th>지번·호수</th><th>임대인 연락처</th><th>임차인·관리 등</th><th>종류</th><th>거래</th><th>금액</th><th>이름·제목</th><th>메모</th><th>올린 날</th></tr></thead><tbody>${r.rows.map(x => `<tr><td style="font-weight:700">${esc(x.addr)}</td><td style="font-family:Consolas,monospace;font-weight:700">${esc(x.phone)}</td><td style="white-space:normal;font-size:12px">${esc(x.contacts)}</td><td>${esc(x.kind)}</td><td>${esc(x.deal)}</td><td>${esc(x.price)}</td><td>${esc(x.title)}</td><td style="white-space:normal;max-width:220px">${esc(x.memo)}</td><td style="white-space:nowrap">${esc(x.last_at)}</td></tr>`).join('')}</tbody></table>${r.more ? '<div class="hint">5건까지만 보입니다. 호수까지 치면 더 정확히 나옵니다.</div>' : ''}</div>`
      msg.textContent = r.count + '건' + (r.more ? '+' : '')
    } catch (e) { if (e.message !== '401') msg.textContent = '오류: ' + e.message }
  }
  $d('db_q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(lookup, 300) })
  $d('db_q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(t); last = ''; lookup() } })
  $d('db_go').onclick = () => { last = ''; lookup() }
  $d('db_q').focus()
}

const BUILD = '2026-10-09 11:47 당근'
async function watchBuild() {
  try {
    const t = await (await fetch(location.pathname || '/', { cache: 'no-store' })).text()
    const m = t.match(/const BUILD = '([^']+)'/)
    if (!m || m[1] === BUILD || document.getElementById('upd_bar')) return
    const d = document.createElement('div'); d.id = 'upd_bar'
    d.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw'
    d.innerHTML = `🔄 화면이 새 버전(${esc(m[1])})으로 바뀌었습니다. 입력 중인 내용을 마친 뒤 새로고침해 주세요. <button class="btn b" id="upd_go" style="padding:5px 10px;white-space:nowrap">새로고침</button>`
    document.body.appendChild(d); document.getElementById('upd_go').onclick = () => location.reload()
  } catch (_) { /* 네트워크 문제면 조용히 */ }
}
