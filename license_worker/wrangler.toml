name = "realty-license-server"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "license_db"
database_id = "562d4ba7-ab26-4958-b6b4-12ac11ef21dc"

# 당근 링크 사진은 bridge-parse 워커가 읽는다 — workers.dev 끼리 fetch 는 error 1042 로 막히므로 서비스 바인딩으로 호출 (2026-10-08)
[[services]]
binding = "PARSE"
service = "bridge-parse"

# 업로드 기록 원문 자동 확인: 매일 KST 11:00 과 18:00 (각 시각에 10분 간격 4회, 한 번에 40건 → 최대 160건, 최근 5시간 안에 본 건 제외) — src/daangn.ts checkSources (2026-10-10)
[triggers]
crons = ["0,10,20,30 2 * * *", "0,10,20,30 9 * * *"]
